name: Local Toy NFT reproducibility

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: local-toy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify local-only teaching workflow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
          package-manager-cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run local-only tests, audit, and reproducibility checks
        run: pnpm verify:ci

      - name: Confirm tracked source files were not rewritten
        run: git diff --exit-code
